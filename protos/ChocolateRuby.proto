#VRML_SIM R2025a utf8
# Modeled Ruby Chocolate Piece (Prism / Berry Hue)

PROTO ChocolateRuby [
  field SFVec3f    translation 0 0 0
  field SFRotation rotation    0 0 1 0
  field SFString   name        "chocolate_ruby"
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    children [
      Shape {
        appearance PBRAppearance {
          baseColor 0.72 0.28 0.45
          roughness 0.8
          metalness 0
        }
        geometry Box {
          size 0.038 0.030 0.020
        }
      }
    ]
    boundingObject Box {
      size 0.038 0.030 0.020
    }
    physics Physics {
      density -1
      mass 0.022
    }
  }
}
