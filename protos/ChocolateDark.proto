#VRML_SIM R2023b utf8
# Modeled Dark Chocolate Praline (35mm x 35mm x 20mm)

PROTO ChocolateDark [
  field SFVec3f    translation 0 0 0
  field SFRotation rotation    0 0 1 0
  field SFString   name        "chocolate_dark"
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    children [
      Shape {
        appearance PBRAppearance {
          baseColor 0.12 0.06 0.03
          roughness 0.35
          metalness 0.05
        }
        geometry Box {
          size 0.035 0.035 0.020
        }
      }
    ]
    boundingObject Box {
      size 0.035 0.035 0.020
    }
    physics Physics {
      density 1300
      mass 0.025
    }
  }
}
